name: release-official

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional release notes (prepended to auto-generated changelog)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm ci || npm install --no-fund --prefer-offline

      # Bump version (repo-specific: url-porter bumps during CI)
      - name: Bump version
        run: npm version minor --no-git-tag-version

      # Pre-build: resolve tag and create draft
      - name: Resolve tag
        id: tag
        uses: synle/workflows/actions/release/_common/resolve-tag@main
        with:
          mode: official

      - name: Create draft
        uses: synle/workflows/actions/release/_common/draft@main
        with:
          tag: ${{ steps.tag.outputs.tag }}
          project_name: URL Porter

      # Build (repo-specific)
      - run: npm run package-syle

      # Commit version bump (repo-specific)
      - name: Commit and push version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "release: ${{ steps.tag.outputs.tag }}"
            git pull --rebase
            git push
          fi
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Re-validate the release commit: pushes made with the workflow's
      # GITHUB_TOKEN do not trigger on: push workflows, so the version-bump
      # commit ships with no build-main run. workflow_dispatch is exempt from
      # that rule, so dispatch build-main on the branch the commit was just
      # pushed to (dispatch ref accepts branch/tag names, not SHAs).
      #
      # The dispatch ref is resolved from a cache that lags the git server:
      # right after a push it can still see the previous HEAD. Verify the
      # created run's head_sha matches the pushed commit and re-dispatch until
      # it does, so the release commit is the one that gets validated.
      - name: Trigger CI on release commit
        uses: actions/github-script@v9
        with:
          script: |
            const pushedSha = '${{ steps.commit.outputs.pushed_sha }}';
            const maxAttempts = 6;
            const settleMs = 10000;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "build-main.yml",
                ref: "main",
              });
              core.info(`Dispatched build-main on main (attempt ${attempt}/${maxAttempts})`);
              await new Promise((resolve) => setTimeout(resolve, settleMs));
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "build-main.yml",
                event: "workflow_dispatch",
                per_page: 1,
              });
              const latest = data.workflow_runs[0];
              if (latest && latest.head_sha === pushedSha) {
                core.info(`build-main dispatched on release commit ${pushedSha}`);
                return;
              }
              core.warning(
                `Attempt ${attempt}: dispatch resolved to ${latest ? latest.head_sha : "no run"}; expected ${pushedSha}`,
              );
            }
            core.setFailed(
              `build-main never dispatched on release commit ${pushedSha} after ${maxAttempts} attempts`,
            );

      # Post-build: generate notes and finalize
      - name: Generate release notes
        uses: synle/workflows/actions/release/_common/notes@main
        with:
          tag: ${{ steps.tag.outputs.tag }}
          project_name: URL Porter
          user_notes: ${{ github.event.inputs.notes }}

      - name: Append install instructions
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo ""
            echo "**Mac / Linux:**"
            echo '```bash'
            echo "curl -L -o url-porter.zip https://github.com/${REPO}/releases/download/${TAG}/url-porter.zip && unzip url-porter.zip -d url-porter"
            echo '```'
            echo ""
            echo "**Windows:**"
            echo '```powershell'
            echo "Invoke-WebRequest -Uri https://github.com/${REPO}/releases/download/${TAG}/url-porter.zip -OutFile url-porter.zip"
            echo "Expand-Archive -Path url-porter.zip -DestinationPath url-porter"
            echo '```'
            echo ""
            echo 'Then load the `url-porter` folder as an unpacked extension in Chrome (`chrome://extensions/` → Developer mode → Load unpacked).'
          } >> release-notes.md

      - name: Finalize release
        uses: synle/workflows/actions/release/_common/finalize@main
        with:
          tag: ${{ steps.tag.outputs.tag }}
          project_name: URL Porter
          mode: official
          build_result: success
          files: url-porter.zip
