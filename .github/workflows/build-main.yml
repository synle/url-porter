name: build-main

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # https://github.com/synle/workflows/blob/main/.github/workflows/build-and-commit-sh.yml
    uses: synle/workflows/.github/workflows/build-and-commit-sh.yml@main
    with:
      deploy-to-pages: true
    permissions:
      contents: write
      pages: write
      id-token: write

  pr-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci || npm i

      - run: npm run build

      - run: node scripts/bundle.js

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: url-porter-pr-${{ github.event.pull_request.number }}
          path: url-porter.zip
          retention-days: 30
          compression-level: 0

      - name: Post PR comment with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stats = fs.statSync('url-porter.zip');
            const sizeMB = (stats.size / 1024 / 1024).toFixed(2);
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `### 📦 Build Artifact`,
              ``,
              `| Artifact | Version | Size |`,
              `|----------|---------|------|`,
              `| [url-porter.zip](${runUrl}#artifacts) | ${pkg.version} | ${sizeMB} MB |`,
              ``,
              `Download from the [Actions run artifacts](${runUrl}#artifacts).`,
            ].join('\n');

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('### 📦 Build Artifact'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
