<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Markdown Preview</title>
    <base target="_blank" />
    <style>
      .url-porter-toast {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(33, 33, 33, 0.92);
        color: #fff;
        padding: 6px 12px;
        border-radius: 4px;
        font:
          12px system-ui,
          sans-serif;
        pointer-events: none;
      }
      pre,
      code {
        cursor: copy;
      }
    </style>
  </head>
  <body>
    <script src="mdview.js"></script>
  </body>
</html>
